<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Al‑Mahdi Wordsearch</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    :root {
        --primary: #145c72;
        --accent: #f4b41a;
        --bg: #ffffff;
        --text: #222;
        --grid-size: 15;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        padding: 15px;
    }

    h1 {
        text-align: center;
        font-size: 2rem;
        color: var(--primary);
        margin-bottom: 5px;
    }

    h3 {
        text-align: center;
        font-size: 1rem;
        margin-bottom: 20px;
        color: #555;
    }

    /* HOME PAGE */
    #homePage {
        text-align: center;
        margin-top: 40px;
    }

    .home-btn {
        display: block;
        width: 70%;
        margin: 12px auto;
        padding: 14px;
        font-size: 1.1rem;
        border-radius: 10px;
        border: none;
        background: var(--primary);
        color: white;
        cursor: pointer;
    }

    .home-btn:hover {
        background: #0f4352;
    }

    /* GAME LAYOUT */
    #gamePage {
        display: none;
    }

    .layout {
        display: grid;
        grid-template-columns: 160px 1fr 150px;
        gap: 10px;
        height: calc(100vh - 120px); /* fits whole screen */
        overflow: hidden;            /* no page scroll */
    }

    @media (max-width: 900px) {
        .layout {
            grid-template-columns: 1fr;
            height: auto;
        }
    }

    .card {
        background: #f7f7f7;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        overflow-y: auto;   /* only card scrolls if needed */
        max-height: 100%;
    }

    .definitions-list {
        font-size: 0.85rem;
        line-height: 1.4;
    }

    .definitions-list li + li {
        margin-top: 5px;
    }

    .term {
        font-weight: bold;
        color: var(--primary);
    }

    /* GRID */
    #grid {
        display: grid;
        gap: 2px;
        background: #ccc;
        touch-action: none;
        max-height: 70vh;   /* grid never too tall */
        max-width: 70vh;    /* keeps grid square */
        margin: 0 auto;     /* centre grid */
    }

    .cell {
        background: white;
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(0.8rem, 2.2vw, 1.1rem);
        user-select: none;
        cursor: pointer;
    }

    .cell.highlight {
    background: #ffe9a8;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffdd77;
}


    .cell.found {
        background: #c7ffd0;
        color: #0b4b1f;
    }
/* ROUND DRAG BUBBLE */
.drag-circle {
    position: absolute;
    width: 40px;
    height: 40px;
    background: rgba(255, 233, 168, 0.8);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px #ffdd77;
    z-index: 9999;
}


    /* WORD LIST */
    .word-item {
        margin-bottom: 6px;
        position: relative;
        font-size: 0.9rem;
    }

    .word-item.found::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 2px solid red;
        transform: translateY(-50%);
    }

    /* TOP BAR */
    .top-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }

    .btn {
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        background: var(--primary);
        color: white;
        cursor: pointer;
    }

    .btn.secondary {
        background: #ddd;
        color: #333;
    }

    .btn.active {
        background: var(--accent);
        color: black;
    }
</style>
</head>

<body>

<!-- HOME PAGE -->
<div id="homePage">
    <h1>Al‑Mahdi Wordsearch</h1>
    <h3>by aliabbas</h3>

    <button class="home-btn" onclick="startLevel(1)">Easy Level</button>
    <button class="home-btn" onclick="startLevel(2)">Medium Level</button>
    <button class="home-btn" onclick="startLevel(3)">Hard Level</button>
</div>

<!-- GAME PAGE -->
<div id="gamePage">
    <div class="top-bar">
        <button class="btn secondary" onclick="goHome()">Home</button>
        <button id="replayBtn" class="btn secondary">Replay Level</button>
        <span id="statusText" style="margin-left:auto; font-size:0.9rem;"></span>
    </div>

    <div class="layout">
        <!-- DEFINITIONS -->
        <div class="card">
            <h3 style="text-align:left; margin-bottom:8px;">Definitions</h3>
            <ul id="definitions" class="definitions-list"></ul>
        </div>

        <!-- GRID -->
        <div class="card">
            <h3 id="levelTitle" style="text-align:left; margin-bottom:8px;"></h3>
            <div id="grid"></div>
        </div>

        <!-- WORD LIST -->
        <div class="card">
            <h3 style="text-align:left; margin-bottom:8px;">Words</h3>
            <div id="wordList"></div>
        </div>
    </div>
</div>

<script>
const LEVELS = {
    1: {
        name: "Level 1 - Easy",
        gridSize: 12,
        words: ["ZUHUR","BADA","MEHDI","QAIM","GAYBAH"],
        definitions: [
            { term:"zuhur", meaning:"Appearance / Manifestation of the Imam" },
            { term:"bada", meaning:"A change in destiny by Allah’s wisdom" },
            { term:"mehdi", meaning:"The Guided One, the promised saviour" },
            { term:"qaim", meaning:"The One who rises to establish justice" },
            { term:"gaybah", meaning:"Occultation, the hidden state of the Imam" }
        ]
    },
    2: {
        name: "Level 2 - Medium",
        gridSize: 13,
        words: ["IMAM","MUNTAZAR","FARAJ","RAJA","THAQALAYN","WILAYA"],
        definitions: [
            { term:"imam", meaning:"Divinely appointed leader and guide" },
            { term:"muntazar", meaning:"The One who is awaited" },
            { term:"faraj", meaning:"Relief / Deliverance through the Imam’s reappearance" },
            { term:"raja", meaning:"Hope and longing for Allah’s mercy" },
            { term:"thaqalayn", meaning:"The two weighty things: Qur’an and Ahl al-Bayt" },
            { term:"wilaya", meaning:"Spiritual authority and guardianship" }
        ]
    },
    3: {
        name: "Level 3 - Hard",
        gridSize: 15,
        words: [
            "GHAIBAT-AL-KUBRA",
            "AL-QAIM BIL-HAQQ",
            "AL-HUJJAH IBN AL-HASAN",
            "INTIDHAR",
            "WILAYAH"
        ],
        definitions: [
            { term:"ghaibat-al-kubra", meaning:"The Major Occultation of Imam al-Mahdi" },
            { term:"al-qaim bil-haqq", meaning:"The one who rises with the Truth" },
            { term:"al-hujjah ibn al-hasan", meaning:"The Proof of Allah, son of al-Hasan" },
            { term:"intidhar", meaning:"Active waiting for the Imam’s return" },
            { term:"wilayah", meaning:"Divine leadership and loyalty to the Imam" }
        ]
    }
};

let currentLevel = 1;
let grid = [];
let placedWords = [];
let gridSize = 0;
let dragging = false;
let dragPath = [];
let dragCircle = null;

function goHome() {
    document.getElementById("homePage").style.display = "block";
    document.getElementById("gamePage").style.display = "none";
}

function startLevel(level) {
    currentLevel = level;
    document.getElementById("homePage").style.display = "none";
    document.getElementById("gamePage").style.display = "block";
    buildLevel(level);
}

function buildLevel(levelNum) {
    const level = LEVELS[levelNum];
    gridSize = level.gridSize;

    document.getElementById("levelTitle").textContent = level.name;

    renderDefinitions(level);
    renderWordList(level);

    generateGrid(level);
    renderGrid();
    attachGridEvents();
    updateStatus();

    document.getElementById("replayBtn").onclick = () => buildLevel(levelNum);
}

function renderDefinitions(level) {
    const box = document.getElementById("definitions");
    box.innerHTML = "";
    level.definitions.forEach(d => {
        box.innerHTML += `<li><span class="term">${d.term}</span> – ${d.meaning}</li>`;
    });
}

function renderWordList(level) {
    const box = document.getElementById("wordList");
    box.innerHTML = "";
    level.words.forEach(w => {
        box.innerHTML += `<div class="word-item" data-word="${normalize(w)}">${w}</div>`;
    });
}

function normalize(w) {
    return w.replace(/[^A-Z]/gi,"").toUpperCase();
}

function generateGrid(level) {
    grid = Array.from({length:gridSize},()=>Array(gridSize).fill(""));
    placedWords = [];

    let success = false;
    for (let attempt=0; attempt<50 && !success; attempt++) {
        grid = Array.from({length:gridSize},()=>Array(gridSize).fill(""));
        placedWords = [];
        let ok = true;

        for (const w of level.words) {
            if (!placeWord(w)) {
                ok = false;
                break;
            }
        }
        if (ok) success = true;
    }

    fillRandom();
}

function placeWord(word) {
    const W = normalize(word).split("");
    const dirs = [
        {dr:0,dc:1},{dr:1,dc:0},{dr:1,dc:1},
        {dr:0,dc:-1},{dr:-1,dc:0},{dr:-1,dc:-1},
        {dr:1,dc:-1},{dr:-1,dc:1}
    ];

    dirs.sort(()=>Math.random()-0.5);

    for (let tries=0; tries<200; tries++) {
        const dir = dirs[Math.floor(Math.random()*dirs.length)];
        let r = Math.floor(Math.random()*gridSize);
        let c = Math.floor(Math.random()*gridSize);

        let cells = [];
        let ok = true;

        for (let i=0;i<W.length;i++) {
            if (r<0||r>=gridSize||c<0||c>=gridSize) { ok=false; break; }
            if (grid[r][c]!=="" && grid[r][c]!==W[i]) { ok=false; break; }
            cells.push({r,c});
            r+=dir.dr; c+=dir.dc;
        }

        if (!ok) continue;

        cells.forEach((p,i)=>grid[p.r][p.c]=W[i]);
        placedWords.push({word:normalize(word),cells});
        return true;
    }
    return false;
}

function fillRandom() {
    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (let r=0;r<gridSize;r++) {
        for (let c=0;c<gridSize;c++) {
            if (!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*letters.length)];
        }
    }
}

function renderGrid() {
    const g = document.getElementById("grid");
    g.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    g.innerHTML = "";

    for (let r=0;r<gridSize;r++) {
        for (let c=0;c<gridSize;c++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.textContent = grid[r][c];
            cell.dataset.r = r;
            cell.dataset.c = c;
            g.appendChild(cell);
        }
    }
}

function attachGridEvents() {
    const g = document.getElementById("grid");

    g.onmousedown = e => {
        const cell = e.target.closest(".cell");
        if (!cell) return;
        startDrag(cell);
    };
g.ontouchmove = e => {
    if (!dragging) return;
    const t = e.touches[0];
    createDragCircle(t.clientX, t.clientY);
    const cell = document.elementFromPoint(t.clientX,t.clientY);
    if (cell && cell.classList.contains("cell")) addDrag(cell);
    e.preventDefault();
};


    document.onmouseup = endDrag;

    g.ontouchstart = e => {
        const t = e.touches[0];
        const cell = document.elementFromPoint(t.clientX,t.clientY);
        if (cell && cell.classList.contains("cell")) startDrag(cell);
    };

    g.ontouchmove = e => {
        if (!dragging) return;
        const t = e.touches[0];
        const cell = document.elementFromPoint(t.clientX,t.clientY);
        if (cell && cell.classList.contains("cell")) addDrag(cell);
        e.preventDefault();
    };

    g.ontouchend = endDrag;
}

function startDrag(cell) {
    dragging = true;
    dragPath = [];
    highlight(cell);
}

function addDrag(cell) {
    highlight(cell);
}

function highlight(cell) {
    const key = cell.dataset.r + "," + cell.dataset.c;

    // Don’t add the same cell twice
    if (dragPath.some(p => p.key === key)) return;

    dragPath.push({
        key,
        r: parseInt(cell.dataset.r),
        c: parseInt(cell.dataset.c),
        el: cell
    });

    // Add the highlight class
    cell.classList.add("highlight");
}

function createDragCircle(x, y) {
    if (!dragCircle) {
        dragCircle = document.createElement("div");
        dragCircle.className = "drag-circle";
        document.body.appendChild(dragCircle);
    }
    dragCircle.style.left = x + "px";
    dragCircle.style.top = y + "px";
}

function removeDragCircle() {
    if (dragCircle) {
        dragCircle.remove();
        dragCircle = null;
    }
}

function endDrag() {
    if (!dragging) return;

    const letters = dragPath.map(p=>grid[p.r][p.c]).join("");
    const reversed = letters.split("").reverse().join("");

    let match = null;
    for (const w of placedWords) {
        if (letters===w.word || reversed===w.word) {
            match = w;
            break;
        }
    }

    if (match) {
        match.cells.forEach(p=>{
            const cell = document.querySelector(`.cell[data-r="${p.r}"][data-c="${p.c}"]`);
            cell.classList.remove("highlight");
            cell.classList.add("found");
        });

        const item = document.querySelector(`.word-item[data-word="${match.word}"]`);
        if (item) item.classList.add("found");
    }

    document.querySelectorAll(".cell.highlight").forEach(c=>c.classList.remove("highlight"));

    updateStatus();
removeDragCircle();

    dragging = false;
    dragPath = [];
}

function updateStatus() {
    const total = LEVELS[currentLevel].words.length;
    const found = document.querySelectorAll(".word-item.found").length;
    document.getElementById("statusText").textContent = `Found ${found} / ${total}`;
}

/* show home first */
goHome();
</script>

</body>
</html>
